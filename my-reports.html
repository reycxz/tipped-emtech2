<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Reports &amp; Ticket Tracker — TIPPED</title>
  <meta name="description" content="Track and monitor status of your reported campus facility and maintenance tickets across T.I.P. Manila." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="dashboard-body">

  <!-- ═══════════════════════════════════════════════════
       TOP NAVIGATION HEADER (/navbar)
  ═══════════════════════════════════════════════════ -->
  <header class="dash-header">
    <div class="dash-header__inner">
      <div class="dash-header__left">
        <a href="/dashboard" class="dash-header__brand" aria-label="TIPPED Dashboard">
          <span class="dash-header__brand-name"><strong>TIPPED</strong></span>
        </a>
        <nav class="dash-nav" aria-label="Main navigation">
          <a href="/dashboard" class="dash-nav__link">Dashboard</a>
          <a href="/report/new" class="dash-nav__link" id="nav-submit-report">Submit Report</a>
          <a href="/my-reports" class="dash-nav__link dash-nav__link--active" id="nav-my-reports">My Reports</a>
        </nav>
      </div>

      <div class="dash-header__right">
        <div class="dash-user">
          <span class="dash-user__name" id="user-display-name">John Doe</span>
          <span class="dash-user__role">USER</span>
        </div>

        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
          <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="theme-toggle__icon theme-toggle__icon--moon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>

        <button id="logout-btn" class="dash-logout-btn" title="Sign out of portal">Logout</button>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════
       MY REPORTS CONTENT (BENTO GRID TRACKER)
  ═══════════════════════════════════════════════════ -->
  <main class="dashboard-page tracker-page">
    <div class="dashboard-container tracker-container">

      <!-- Header Title -->
      <div class="tracker-header">
        <h1 class="tracker-header__title">My Incident Reports</h1>
      </div>

      <!-- Bento Tile 1 — Filter & Search Control Bar (col-span-12) -->
      <section class="bento-tile--tracker-controls" aria-label="Ticket Filter Controls">
        <div class="tracker-toolbar">
          <div class="tracker-toolbar__filters">
            <!-- Dropdown 1: Status -->
            <div class="tracker-select-wrap">
              <label for="filter-status" class="tracker-select-label">Status</label>
              <div class="tracker-select-custom">
                <select id="filter-status" class="tracker-select" aria-label="Filter by status">
                  <option value="All">All Reports</option>
                  <option value="Pending">Pending</option>
                  <option value="Under Review">Under Review</option>
                  <option value="In Progress">In Progress</option>
                  <option value="Resolved">Resolved</option>
                  <option value="Dismissed">Dismissed</option>
                </select>
                <svg viewBox="0 0 20 20" fill="currentColor" class="tracker-select-chevron">
                  <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
              </div>
            </div>

            <!-- Dropdown 2: Building -->
            <div class="tracker-select-wrap">
              <label for="filter-building" class="tracker-select-label">Building</label>
              <div class="tracker-select-custom">
                <select id="filter-building" class="tracker-select" aria-label="Filter by building">
                  <option value="All">All Buildings</option>
                  <option value="Arlegui Campus">Arlegui Campus</option>
                  <option value="Casal Campus">Casal Campus</option>
                </select>
                <svg viewBox="0 0 20 20" fill="currentColor" class="tracker-select-chevron">
                  <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- Inline Search Field (Right Aligned) -->
          <div class="tracker-search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="tracker-search-icon">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="tracker-search-input"
              class="tracker-search-input"
              placeholder="Search by Ticket ID or area..."
              aria-label="Search reports"
            />
          </div>
        </div>
      </section>

      <!-- Bento Tile Feed — Ticket Cards Grid (col-span-12 grid grid-cols-1 md:grid-cols-2 gap-4) -->
      <section id="tracker-cards-grid" class="tracker-cards-grid" aria-label="Incident Reports Feed">
        <!-- Rendered dynamically by my-reports.js -->
      </section>

    </div>
  </main>

  <!-- ═══════════════════════════════════════════════════
       TICKET DETAILS MODAL / DRAWER
  ═══════════════════════════════════════════════════ -->
  <div id="details-modal" class="details-modal details-modal--hidden" role="dialog" aria-modal="true" aria-labelledby="details-modal-id">
    <div id="details-backdrop" class="details-backdrop"></div>
    <div class="details-card">
      <div class="details-card__header">
        <div class="details-card__title-group">
          <span class="details-card__id" id="details-modal-id">ARL-FAC-2026-0000</span>
          <span class="ticket-status-pill" id="details-modal-status">PENDING</span>
        </div>
        <button type="button" id="details-close-btn" class="details-close-btn" aria-label="Close details">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="details-card__body">
        <div class="details-meta-grid">
          <div class="details-meta-item">
            <span class="details-meta-label">Submitted On</span>
            <span class="details-meta-val" id="details-modal-date">-</span>
          </div>
          <div class="details-meta-item">
            <span class="details-meta-label">Campus Location</span>
            <span class="details-meta-val" id="details-modal-campus">-</span>
          </div>
          <div class="details-meta-item">
            <span class="details-meta-label">Category</span>
            <span class="details-meta-val" id="details-modal-category">-</span>
          </div>
        </div>

        <div class="details-section">
          <h4 class="details-section__title">Problem Description</h4>
          <p class="details-section__text" id="details-modal-desc">-</p>
        </div>

        <div class="details-section" id="details-evidence-section">
          <h4 class="details-section__title">Photo Evidence</h4>
          <div class="ticket-card__evidence" id="details-modal-evidence"></div>
        </div>

        <div class="details-section" id="details-remarks-section">
          <div class="ticket-remarks-box" id="details-modal-remarks">
            <div class="ticket-remarks__header">
              <svg viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
              </svg>
              <span>OFFICIAL FACILITIES RESPONSE</span>
            </div>
            <p class="ticket-remarks__text" id="details-modal-remark-text">"-"</p>
            <div class="ticket-remarks__footer">
              <span class="ticket-remarks__action-badge" id="details-modal-remark-action">Updated</span>
              <span id="details-modal-remark-admin">• Updated by Facilities Office</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════
       INSTANT LIGHTBOX MODAL (PHOTO EVIDENCE VIEWER)
  ═══════════════════════════════════════════════════ -->
  <div id="lightbox-modal" class="lightbox-modal lightbox-modal--hidden" role="dialog" aria-modal="true" aria-label="Photo evidence lightbox">
    <div id="lightbox-backdrop" class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <div class="lightbox-img-wrap">
        <button type="button" id="lightbox-close-btn" class="lightbox-close-btn" aria-label="Close image preview">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
        <img id="lightbox-img" class="lightbox-img" src="" alt="Enlarged evidence photo" />
      </div>
      <div id="lightbox-caption" class="lightbox-caption">Photo Evidence Preview</div>
    </div>
  </div>

  <script src="/my-reports/my-reports.js"></script>
</body>
</html>
